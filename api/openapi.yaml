components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: devstack_session
      description: |
        Random 32-byte session value created by GET /api/v1/session. Required
        for mutations; read-only GETs and SSE streams do not need it.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        HMAC-SHA256(server secret, session) returned by GET /api/v1/session.
        Required for cookie-authenticated mutations.
    socketPeerAuth:
      type: apiKey
      in: header
      name: X-Devstack-Socket
      description: |
        Documentation-only marker for the Unix-socket transport. The server
        authenticates socket peers with SO_PEERCRED via WithSocketAuth and does
        not read this header.

  parameters:
    SiteRef:
      name: ref
      in: path
      required: true
      description: Site id or unique site name.
      schema:
        type: string
    PHPVersion:
      name: version
      in: path
      required: true
      description: PHP major.minor line (8.2, 8.3, 8.4, or 8.5).
      schema:
        type: string
        examples: ["8.4"]
    ServiceID:
      name: id
      in: path
      required: true
      description: Catalog service id (for example nginx, mysql, redis).
      schema:
        type: string
        examples: [nginx]

  responses:
    BadRequest:
      description: Invalid JSON, missing field, or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The dashboard session cookie is missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: CSRF token is missing or invalid, or the Host header is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenHost:
      description: The Host header is not in the loopback allowlist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected daemon failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HelperUnavailable:
      description: The privileged helper is unreachable or rejected the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HelperError:
      description: |
        The privileged helper returned a structured internal failure
        (HELPER_ERROR) rather than a transport failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: The requested service is not configured in this daemon.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HelperServiceUnavailable:
      description: The privileged service helper is unreachable or unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: The path exists but does not accept this HTTP method.
      headers:
        Allow:
          description: Comma-separated methods supported by the path.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Database:
      type: object
      properties:
        name: {type: string}
        service_id: {type: string}
        engine: {type: string}
        size_bytes: {type: integer, format: int64}
        table_count: {type: integer}
        linked_sites:
          type: array
          items: {$ref: "#/components/schemas/DatabaseSiteRef"}
        managed: {type: boolean}
        missing: {type: boolean}
    DatabaseSiteRef:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
    DatabaseGrant:
      type: object
      properties:
        database: {type: string}
        preset: {type: string}
        privileges:
          type: array
          items: {type: string}
    DatabaseUser:
      type: object
      properties:
        id: {type: string}
        service_id: {type: string}
        engine: {type: string}
        username: {type: string}
        host: {type: string}
        enabled: {type: boolean}
        managed: {type: boolean}
        password_managed: {type: boolean}
        access_level: {type: string}
        grants:
          type: array
          items: {$ref: "#/components/schemas/DatabaseGrant"}
        linked_sites:
          type: array
          items: {$ref: "#/components/schemas/DatabaseSiteRef"}
    DatabaseConnection:
      type: object
      properties:
        engine: {type: string}
        host: {type: string}
        port: {type: integer}
        database: {type: string}
        username: {type: string}
        password_managed: {type: boolean}
        url: {type: string}
        env:
          type: object
          additionalProperties: {type: string}
    DatabaseLink:
      type: object
      properties:
        id: {type: string}
        site_id: {type: string}
        site_name: {type: string}
        service_id: {type: string}
        engine: {type: string}
        database: {type: string}
        user_id: {type: string}
        username: {type: string}
        host: {type: string}
        primary: {type: boolean}
        password_managed: {type: boolean}
        available: {type: boolean}
        error: {type: string}
        connection: {$ref: "#/components/schemas/DatabaseConnection"}
    DatabaseServiceImpact:
      type: object
      properties:
        service_id: {type: string}
        linked_sites:
          type: array
          items: {$ref: "#/components/schemas/DatabaseSiteRef"}
        backups:
          type: array
          items: {$ref: "#/components/schemas/DatabaseBackup"}
        running_jobs:
          type: array
          items: {$ref: "#/components/schemas/DatabaseJob"}
    DatabaseBackup:
      type: object
      properties:
        id: {type: string}
        service_id: {type: string}
        engine: {type: string}
        database: {type: string}
        size_bytes: {type: integer, format: int64}
        sha256: {type: string}
        kind: {type: string}
        status: {type: string}
        created_at: {type: string, format: date-time}
        error: {type: string}
    DatabaseJob:
      type: object
      properties:
        id: {type: string}
        service_id: {type: string}
        database: {type: string}
        kind: {type: string}
        status: {type: string}
        progress: {type: integer}
        message: {type: string}
        backup_id: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    DatabaseSecret:
      type: object
      properties:
        value: {type: string, writeOnly: true}
    CreateDatabaseRequest:
      type: object
      required: [name]
      properties:
        name: {type: string}
        charset: {type: string}
        collation: {type: string}
    RenameDatabaseRequest:
      type: object
      required: [name, confirm]
      properties:
        name: {type: string}
        confirm: {type: string}
    DropDatabaseRequest:
      type: object
      required: [confirm]
      properties:
        confirm: {type: string}
        backup_first: {type: boolean}
    CreateDatabaseUserRequest:
      type: object
      required: [username]
      properties:
        username: {type: string}
        host: {type: string}
        grants:
          type: array
          items: {$ref: "#/components/schemas/DatabaseGrant"}
        access_level: {type: string}
    UpdateDatabaseUserRequest:
      type: object
      properties:
        enabled: {type: boolean}
        grants:
          type: array
          items: {$ref: "#/components/schemas/DatabaseGrant"}
        access_level: {type: string}
    DeleteDatabaseUserRequest:
      type: object
      required: [confirm]
      properties:
        confirm: {type: string}
        reassign_owned: {type: boolean}
    CreateDatabaseBackupRequest:
      type: object
      properties:
        kind: {type: string}
    RestoreDatabaseBackupRequest:
      type: object
      properties:
        target: {type: string}
        overwrite: {type: boolean}
        confirm: {type: string}
        pre_restore_backup: {type: boolean}
    ImportDatabaseRequest:
      type: object
      properties:
        mode: {type: string, enum: [merge, replace]}
        confirm: {type: string}
        pre_import_backup: {type: boolean}
    LinkDatabaseRequest:
      type: object
      required: [service_id, database, user_id]
      properties:
        service_id: {type: string}
        database: {type: string}
        user_id: {type: string}
        password: {type: string, writeOnly: true}
        primary: {type: boolean}
    SiteDatabaseRequest:
      type: object
      required: [service_id]
      properties:
        service_id: {type: string}
        database: {type: string}
        new_database: {$ref: "#/components/schemas/CreateDatabaseRequest"}
        user_id: {type: string}
        new_user: {$ref: "#/components/schemas/CreateDatabaseUserRequest"}
        password: {type: string, writeOnly: true}
        grant: {type: string}
        primary: {type: boolean}
    SiteDatabaseResult:
      type: object
      properties:
        link: {$ref: "#/components/schemas/DatabaseLink"}
        database: {$ref: "#/components/schemas/Database"}
        user: {$ref: "#/components/schemas/DatabaseUser"}
        warning: {type: string}
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          examples:
            - INVALID_REQUEST
            - NOT_FOUND
            - DOMAIN_CONFLICT
            - HOSTS_SYNC_FAILED
            - RUNTIME_MISSING
            - PHP_VERSION_IN_USE
            - PHP_CONFIG_INVALID
            - TRUST_MISSING
            - PORT_IN_USE
            - PAYLOAD_TOO_LARGE
            - FORBIDDEN
            - UNAUTHORIZED
            - HELPER_UNAVAILABLE
            - HELPER_ERROR
            - SERVICE_CONFLICT
            - METHOD_NOT_ALLOWED
            - INTERNAL
        message:
          type: string
          description: Human-readable explanation.
        details:
          description: Optional structured context.

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          examples: [ok]
        version:
          type: string
          examples: [dev]

    Session:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          description: HMAC-SHA256(server secret, session) in lowercase hex.

    SiteKind:
      type: string
      enum: [static, php, node]

    BackendKind:
      type: string
      enum: [local, wsl]

    SourceMode:
      type: string
      enum: [local, windows, wsl]
      description: Storage mode identifying where a site's project files reside.

    DesiredState:
      type: string
      enum: [running, stopped]

    SiteStatus:
      type: string
      enum: [stopped, starting, running, stopping, crashed, error]

    Site:
      type: object
      required:
        - id
        - name
        - domain
        - www
        - backend
        - source_mode
        - host_path
        - backend_path
        - kind
        - desired_state
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
          examples: [blog.test]
        www:
          type: boolean
        backend:
          $ref: "#/components/schemas/BackendKind"
        source_mode:
          $ref: "#/components/schemas/SourceMode"
        host_path:
          type: string
        backend_path:
          type: string
        kind:
          $ref: "#/components/schemas/SiteKind"
        php_version:
          type: string
        php_build:
          type: string
        php_extensions:
          type: object
          additionalProperties:
            type: boolean
        php_ini:
          type: object
          additionalProperties:
            type: string
        php_ini_raw:
          type: string
        php_config_hash:
          type: string
        php_fpm:
          type: object
          description: Persisted per-site php-fpm pool sizing applied to the live master.
          properties:
            mode:
              type: string
              enum: [dynamic, static]
            max_children:
              type: integer
            start_servers:
              type: integer
            min_spare_servers:
              type: integer
            max_spare_servers:
              type: integer
            listen_backlog:
              type: integer
        node_version:
          type: string
        command:
          type: string
        env:
          type: object
          additionalProperties:
            type: string
        document_root:
          type: string
        front_controller:
          type: boolean
        spa_fallback:
          type: boolean
        tls:
          type: boolean
        force_https:
          type: boolean
        desired_state:
          $ref: "#/components/schemas/DesiredState"
        status:
          $ref: "#/components/schemas/SiteStatus"
        http_port:
          type: integer
          minimum: 0
        fastcgi_port:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSiteRequest:
      type: object
      required: [name, path, kind]
      properties:
        name:
          type: string
          description: Unique site name; the domain is derived as <name>.test.
        path:
          type: string
          description: Absolute project directory on the host.
        host_path:
          type: string
          description: Alias for path, accepted for the M1 appendix shape.
        kind:
          $ref: "#/components/schemas/SiteKind"
        source_mode:
          $ref: "#/components/schemas/SourceMode"
        node_version:
          type: string
        command:
          type: string
        document_root:
          type: string
        php_version:
          type: string
          description: PHP major.minor line; required for php sites.
        php_build:
          type: string
          description: Installed build id; omitted selects the newest installed build for the line.
        php_extensions:
          type: object
          additionalProperties:
            type: boolean
        php_ini:
          type: object
          additionalProperties:
            type: string
        php_ini_raw:
          type: string
        front_controller:
          type: boolean
        front_controller_file:
          type: string
          description: Relative PHP front-controller file (for example public/index.php).
        front_controller_mode:
          type: string
          enum: [auto, generated, htaccess]
        apache_allow_override:
          type: string
          enum: [all, fileinfo, none]
        spa_fallback:
          type: boolean
        spa_fallback_file:
          type: string
          description: Relative fallback file served for non-file paths (for example app.html).
        build:
          $ref: "#/components/schemas/BuildProfile"
        www:
          type: boolean
        tls:
          type: boolean
        force_https:
          type: boolean
        env:
          type: object
          additionalProperties:
            type: string
        database:
          $ref: "#/components/schemas/SiteDatabaseRequest"

    BuildProfile:
      type: object
      description: Optional client-side asset build profile.
      required: [node_version, command]
      properties:
        node_version:
          type: string
        command:
          type: string
        output:
          type: string
        env:
          type: object
          additionalProperties:
            type: string

    UpdateSiteRequest:
      type: object
      description: Omitted scalar fields are unchanged. An empty env object clears the environment.
      properties:
        domain:
          type: string
        source_mode:
          $ref: "#/components/schemas/SourceMode"
          description: Direct modification via update is rejected; use POST /api/v1/sites/{ref}/source instead.
        www:
          type: boolean
        tls:
          type: boolean
        force_https:
          type: boolean
        spa_fallback:
          type: boolean
        front_controller:
          type: boolean
        command:
          type: string
        document_root:
          type: string
        env:
          type: object
          additionalProperties:
            type: string

    ChangeSiteSourceRequest:
      type: object
      required: [mode, path]
      properties:
        mode:
          $ref: "#/components/schemas/SourceMode"
        path:
          type: string
          description: Destination path on the target source filesystem.
        remove_source:
          type: boolean
          description: Whether to remove the original source directory after copy (currently unsupported).
          default: false

    PHPChangeRequest:
      type: object
      description: |
        Empty version/build keep the current values. Absent maps and an absent
        ini_raw keep the current overrides; present values replace them.
      properties:
        version:
          type: string
          description: PHP major.minor line.
        build:
          type: string
          description: Installed build id.
        extensions:
          type: object
          additionalProperties:
            type: boolean
        ini:
          type: object
          additionalProperties:
            type: string
        ini_raw:
          type: string
          nullable: true

    PHPExecRequest:
      type: object
      required: [argv]
      properties:
        argv:
          type: array
          items:
            type: string
          description: Arguments forwarded to the site's PHP binary.

    PHPExecResult:
      type: object
      required: [exit_code, stdout, stderr]
      properties:
        exit_code:
          type: integer
        stdout:
          type: string
        stderr:
          type: string

    PHPExtension:
      type: object
      required: [name, type, so, default, standard, versions]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [extension, zend_extension]
        so:
          type: string
        default:
          type: boolean
        standard:
          type: boolean
        versions:
          type: array
          items:
            type: string
        requires:
          type: array
          items:
            type: string

    PHPResolvedExtension:
      type: object
      required: [name, type, so, required]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [extension, zend_extension]
        so:
          type: string
        required:
          type: boolean
          description: True when the extension is enabled by defaults or a dependency.
        required_by:
          type: array
          items:
            type: string

    PHPDefaults:
      type: object
      required: [version, ini, extensions]
      properties:
        version:
          type: string
        ini:
          type: object
          additionalProperties:
            type: string
        extensions:
          type: object
          additionalProperties:
            type: boolean

    PHPDefaultsRequest:
      type: object
      description: The path version is authoritative; a version in the body is ignored.
      properties:
        ini:
          type: object
          additionalProperties:
            type: string
        extensions:
          type: object
          additionalProperties:
            type: boolean

    PHPMigrationResult:
      type: object
      required: [site, ok]
      properties:
        site:
          type: string
        ok:
          type: boolean
        error:
          type: string

    PHPDefaultsResult:
      type: object
      required: [defaults, sites]
      properties:
        defaults:
          $ref: "#/components/schemas/PHPDefaults"
        sites:
          type: array
          items:
            $ref: "#/components/schemas/PHPMigrationResult"

    PHPMigrationRequest:
      type: object
      required: [from_version]
      properties:
        from_version:
          type: string
          description: Source PHP major.minor line.
        to_version:
          type: string
          description: Target line; required unless to_build is supplied.
        to_build:
          type: string
          description: Exact installed target build; also implies the target line.

    PHPInfo:
      type: object
      required:
        - site
        - build
        - defaults
        - extensions
        - available_extensions
        - builtins
        - ini
        - ini_raw
        - generated_ini
        - fpm_config
        - config_hash
      properties:
        site:
          $ref: "#/components/schemas/Site"
        build:
          $ref: "#/components/schemas/RuntimeBuild"
        defaults:
          $ref: "#/components/schemas/PHPDefaults"
        extensions:
          type: array
          items:
            $ref: "#/components/schemas/PHPResolvedExtension"
        available_extensions:
          type: array
          items:
            $ref: "#/components/schemas/PHPExtension"
        builtins:
          type: array
          items:
            type: string
        ini:
          type: object
          additionalProperties:
            type: string
        ini_raw:
          type: string
        generated_ini:
          type: string
        fpm_config:
          type: string
        config_hash:
          type: string

    NodeRelease:
      type: object
      required: [version, date, lts, security, npm, modules, file]
      properties:
        version:
          type: string
          examples: ["22.11.0"]
        date:
          type: string
        lts:
          type: string
          description: LTS codename, or an empty string for a non-LTS release.
        security:
          type: boolean
        npm:
          type: string
        modules:
          type: string
        file:
          type: string

    NodeMajor:
      type: object
      required: [major, latest, releases]
      properties:
        major:
          type: integer
        latest:
          $ref: "#/components/schemas/NodeRelease"
        releases:
          type: array
          items:
            $ref: "#/components/schemas/NodeRelease"

    NodeSnapshot:
      type: object
      required: [majors, all, source, stale]
      properties:
        majors:
          type: array
          items:
            $ref: "#/components/schemas/NodeMajor"
        all:
          type: array
          items:
            $ref: "#/components/schemas/NodeRelease"
        source:
          type: string
          enum: [live, cache, embedded]
        cached_at:
          type: string
          format: date-time
        stale:
          type: boolean
        warning:
          type: string

    NodeDefaultStatus:
      type: object
      required: [shim_dir, shim_installed, source]
      properties:
        configured:
          type: string
        build:
          $ref: "#/components/schemas/RuntimeBuild"
        shim_dir:
          type: string
        shim_installed:
          type: boolean
        source:
          type: string
          enum: [setting, newest, ""]

    NodePreflight:
      type: object
      required: [entry, release]
      properties:
        entry:
          $ref: "#/components/schemas/CatalogEntry"
        release:
          $ref: "#/components/schemas/NodeRelease"

    RuntimeBuild:
      type: object
      required: [id, kind, version, backend, path, checksum, installed_at]
      properties:
        id:
          type: string
        kind:
          type: string
          examples: [node, php]
        version:
          type: string
        backend:
          $ref: "#/components/schemas/BackendKind"
        path:
          type: string
        checksum:
          type: string
        installed_at:
          type: string
          format: date-time

    CatalogEntry:
      type: object
      required: [id, kind, version, build, url, sha256, size]
      properties:
        id:
          type: string
        kind:
          type: string
        version:
          type: string
        build:
          type: string
          examples: [linux-x64]
        url:
          type: string
          format: uri
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        size:
          type: integer
          format: int64

    InstallRuntimeRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Catalog entry id.

    CheckStatus:
      type: string
      enum: [ok, warn, fail, skipped]

    DoctorCheck:
      type: object
      required: [id, title, status, detail, remediation]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/CheckStatus"
        detail:
          type: string
        remediation:
          type: string

    DoctorReport:
      type: object
      required: [checks, ok]
      properties:
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DoctorCheck"
        ok:
          type: boolean

    TrustTarget:
      type: object
      required: [name, ok, detail]
      properties:
        name:
          type: string
        ok:
          type: boolean
        detail:
          type: string

    TrustTargets:
      type: array
      items:
        $ref: "#/components/schemas/TrustTarget"

    FsEntry:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string

    FsListing:
      type: object
      required: [path, entries]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FsEntry"

    TerminalTicket:
      type: object
      required: [ticket, expires_at]
      properties:
        ticket:
          type: string
          description: One-use, URL-safe ticket. Never log this value.
        expires_at:
          type: string
          format: date-time
          description: Expiry timestamp; at most 30 seconds after issuance.

    Settings:
      type: object
      required:
        - home
        - user_home
        - wsl_distro
        - http_port
        - https_port
        - ui_port
        - auto_start_sites
        - serving_mode
        - serving_provider
        - graceful_stop_seconds
        - max_request_body_mb
        - log_max_mb
        - log_keep
      properties:
        home:
          type: string
          description: Machine root under which devstack keeps state.
        user_home:
          type: string
        wsl_distro:
          type: string
        http_port:
          type: integer
        https_port:
          type: integer
        ui_port:
          type: integer
        auto_start_sites:
          type: boolean
        serving_mode:
          type: string
          enum: [builtin, nginx, apache]
          description: Active serving mode; builtin uses the Go proxy.
        serving_provider:
          type: string
          enum: [native, docker]
          description: |
            native uses host-installed nginx/Apache; docker uses the managed
            service containers. docker requires serving_mode nginx or apache.
        graceful_stop_seconds:
          type: integer
        max_request_body_mb:
          type: integer
          description: |
            Machine config value. The API's actual transport guard is
            Config.MaxBodyBytes, configured separately and defaulting to
            1024 MiB.
        log_max_mb:
          type: integer
        log_keep:
          type: integer
        restart_required:
          type: boolean
          description: |
            True when config.yaml contains listener ports that the running
            daemon has not bound yet. Cleared on daemon startup.
        public_ports_fixed:
          type: boolean
          description: |
            True on Windows. The helper forwarders and firewall rule target
            fixed 8080/8443 loopback ports, so PATCH rejects changes to
            http_port and https_port; ui_port remains editable.

    SettingsUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        http_port:
          type: integer
          minimum: 1
          maximum: 65535
        https_port:
          type: integer
          minimum: 1
          maximum: 65535
        ui_port:
          type: integer
          minimum: 1
          maximum: 65535

    SettingsUpdateResponse:
      allOf:
        - $ref: "#/components/schemas/Settings"
        - type: object
          required: [restart_required]
          properties:
            restart_required:
              type: boolean
              description: True when any listener port changed and a daemon restart is required.
            warnings:
              type: array
              items:
                type: string

    VhostStatus:
      type: object
      required:
        - mode
        - server
        - server_version
        - bridge_path
        - include_present
        - current_release
        - config_ok
        - last_sync
      properties:
        mode:
          type: string
          enum: [builtin, nginx, apache]
        server:
          type: string
        server_version:
          type: string
        bridge_path:
          type: string
        include_present:
          type: boolean
        current_release:
          type: string
        config_ok:
          type: boolean
        last_error:
          type: string
        last_sync:
          type: string
          format: date-time
        service_active:
          type: boolean
          description: Whether the selected nginx/Apache systemd service is active.
        default_server_conflict:
          type: boolean
          description: A foreign server configuration already declares default_server on the devstack listen ports; the devstack 404 vhost is installed without the marker.
        tls_dir:
          type: string
          description: Helper-managed TLS directory reported by the helper.
        tls_dir_mode:
          type: integer
          format: uint32
          description: Permission bits of the TLS directory.
        tls_files:
          type: array
          description: Metadata for files in the helper-managed TLS directory.
          items:
            type: object
            required: [name, mode, regular]
            properties:
              name:
                type: string
              mode:
                type: integer
                format: uint32
              regular:
                type: boolean

    VhostModeRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [builtin, nginx, apache]

    VhostPreview:
      type: object
      required: [server, site, content]
      properties:
        server:
          type: string
          enum: [nginx, apache]
        site:
          type: string
        content:
          type: string
          description: Rendered native server configuration as plain text.

    LogLine:
      type: object
      required: [time, site_id, source, text]
      properties:
        time:
          type: string
          format: date-time
        site_id:
          type: string
        source:
          type: string
          examples: [app, fpm, proxy, supervisor]
        text:
          type: string

    Event:
      type: object
      required: [id, type, message, created_at]
      properties:
        id:
          type: integer
          format: int64
        site_id:
          type: string
        type:
          type: string
          examples: [site.running, site.stopped, doctor.repaired]
        message:
          type: string
        created_at:
          type: string
          format: date-time

    PerformanceStep:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          type: string
          enum: [ok, skipped, failed, rolled_back]
        detail:
          type: string
        backup:
          type: string

    PerformanceManagedFile:
      type: object
      required: [path, active]
      properties:
        path:
          type: string
        content:
          type: string
        active:
          type: boolean

    PerformanceHostFile:
      type: object
      required: [path, exists]
      properties:
        path:
          type: string
        exists:
          type: boolean
        current:
          type: string
        proposed:
          type: string
        diff:
          type: string

    PerformanceHostTuning:
      type: object
      required: [available, managed, applied]
      properties:
        available:
          type: boolean
        managed:
          type: boolean
        applied:
          type: boolean
        sysctl_path:
          type: string
        limits_path:
          type: string
        backup_dir:
          type: string
        applied_at:
          type: string
          format: date-time
        profile:
          type: string
        error:
          type: string

    PerformanceStatus:
      type: object
      required: [profile, resources, values, host_tuning]
      properties:
        profile:
          type: string
          enum: [balanced, throughput, custom]
        custom:
          type: object
          description: Stored custom values; present when configured.
        resources:
          type: object
          description: Measured CPU, cgroup quota, memory, page size, RLIMIT_NOFILE, and allowlisted sysctl values.
        values:
          type: object
          description: Effective computed values for the current profile.
        applied:
          type: object
          nullable: true
          description: Last successfully applied profile and rollback metadata.
        host_tuning:
          $ref: "#/components/schemas/PerformanceHostTuning"
        active_server:
          type: string
          enum: [nginx, apache]
        warnings:
          type: array
          items:
            type: string

    PerformanceProfileRequest:
      type: object
      required: [profile]
      properties:
        profile:
          type: string
          enum: [balanced, throughput, custom]
        custom:
          type: object
          description: Required with profile=custom; revalidated on every preview/apply.

    PerformancePreview:
      type: object
      required: [profile, values, nginx, apache, managed_files, host_tuning]
      properties:
        profile:
          type: string
        values:
          type: object
        resources:
          type: object
        active_server:
          type: string
        nginx:
          type: object
          properties:
            main:
              type: string
            events:
              type: string
            http:
              type: string
        apache:
          type: object
          properties:
            config:
              type: string
        php:
          type: array
          items:
            type: object
            properties:
              site_id:
                type: string
              pool:
                type: string
              ini:
                type: string
        managed_files:
          type: array
          items:
            $ref: "#/components/schemas/PerformanceManagedFile"
        host_tuning:
          type: object
          properties:
            opt_in:
              type: boolean
            files:
              type: array
              items:
                $ref: "#/components/schemas/PerformanceHostFile"
            warnings:
              type: array
              items:
                type: string
        warnings:
          type: array
          items:
            type: string

    PerformanceApplyRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true.
        host_tuning:
          type: boolean
          description: Explicit opt-in for host-wide sysctl/limits changes.

    PerformanceApplyResult:
      type: object
      required: [applied, profile, host_tuning, steps]
      properties:
        applied:
          type: boolean
        profile:
          type: string
        applied_at:
          type: string
          format: date-time
        host_tuning:
          type: boolean
        active_server:
          type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/PerformanceManagedFile"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PerformanceStep"
        backup_dir:
          type: string
        rollback_error:
          type: string
        warnings:
          type: array
          items:
            type: string

    PerformanceResetRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: boolean
          description: Must be true.

    PerformanceResetResult:
      type: object
      required: [reset, steps]
      properties:
        reset:
          type: boolean
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PerformanceStep"
        backup_dir:
          type: string
        rollback_error:
          type: string
        warnings:
          type: array
          items:
            type: string

    PerformanceBenchmarkRequest:
      type: object
      required: [site]
      properties:
        site:
          type: string
          description: Registered site id or exact name.
        duration_s:
          type: integer
          minimum: 1
          maximum: 3600
          default: 30
        connections:
          type: integer
          minimum: 1
          maximum: 100000
          default: 100

    PerformanceMeasurement:
      type: object
      required: [requests, errors, requests_per_second, p50_ms, p95_ms, p99_ms]
      properties:
        requests:
          type: integer
          format: int64
        errors:
          type: integer
          format: int64
        requests_per_second:
          type: number
        p50_ms:
          type: number
        p95_ms:
          type: number
        p99_ms:
          type: number
        duration_seconds:
          type: number

    PerformanceBenchmarkResult:
      type: object
      required: [id, site, target, profile, status, tool, tool_version, duration_s, connections, started_at, finished_at, directory, raw_file]
      properties:
        id:
          type: string
        site:
          type: string
        target:
          type: string
        profile:
          type: string
        status:
          type: string
          enum: [completed, failed, canceled]
        tool:
          type: string
        tool_version:
          type: string
        limitations:
          type: array
          items:
            type: string
        duration_s:
          type: integer
        connections:
          type: integer
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        measured:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PerformanceMeasurement"
        error:
          type: string
        directory:
          type: string
        raw_file:
          type: string
        profile_applied_at:
          type: string
          format: date-time


    ServicePort:
      type: object
      required: [host, container]
      properties:
        host:
          type: integer
        container:
          type: integer
        protocol:
          type: string
        loopback:
          type: boolean

    ServiceActionResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]

    UninstallServiceRequest:
      type: object
      properties:
        delete_data:
          type: boolean
          default: false
          description: Back up and delete service data after removing the container.

    UninstallServiceResult:
      type: object
      properties:
        backup_path:
          type: string
          description: Path to the verified backup written before data deletion.

    ServiceLogs:
      type: object
      required: [logs]
      properties:
        logs:
          type: string
          description: Bounded container log tail.

    ServiceCredentials:
      type: object
      required: [engine, username, password, database, host, port]
      description: |
        Returned only by the explicit reveal and rotate routes. Credentials are
        never included in list or get responses.
      properties:
        engine:
          type: string
          examples: [mysql]
        username:
          type: string
        password:
          type: string
        database:
          type: string
        host:
          type: string
        port:
          type: integer

    ServiceConfigConflict:
      type: object
      required: [active, resolution_required]
      properties:
        active:
          type: boolean
        resolution_required:
          type: boolean
        reason:
          type: string
        allowed_resolutions:
          type: array
          items:
            type: string
            enum: [keep, use, merge]

    ServiceConfigFile:
      type: object
      required: [path, class, generated, modified, detached, hash, size, conflict]
      properties:
        path:
          type: string
        class:
          type: string
          enum: [base, generated, custom]
        generated:
          type: boolean
        modified:
          type: boolean
        detached:
          type: boolean
        hash:
          type: string
        size:
          type: integer
          format: int64
        conflict:
          $ref: "#/components/schemas/ServiceConfigConflict"

    ServiceConfigListing:
      type: object
      required: [service, files]
      properties:
        service:
          type: string
        files:
          type: array
          items:
            $ref: "#/components/schemas/ServiceConfigFile"

    ServiceConfigContent:
      allOf:
        - $ref: "#/components/schemas/ServiceConfigFile"
        - type: object
          required: [content]
          properties:
            content:
              type: string

    ServiceConfigDiffRequest:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string

    ServiceConfigDiff:
      type: object
      required: [path, diff, current_hash, proposed_hash, current_size, proposed_size, status, conflict]
      properties:
        path:
          type: string
        diff:
          type: string
        current_hash:
          type: string
        proposed_hash:
          type: string
        current_size:
          type: integer
          format: int64
        proposed_size:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/ServiceConfigFile"
        conflict:
          $ref: "#/components/schemas/ServiceConfigConflict"

    ServiceConfigApplyRequest:
      type: object
      required: [path, content]
      properties:
        path:
          type: string
        content:
          type: string
        resolution:
          type: string
          enum: [keep, use, merge]

    ServiceConfigResetRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string

    ServiceConfigApplyResult:
      type: object
      required:
        - service
        - path
        - action
        - changed
        - detached
        - hash
        - size
        - active
        - live
        - reloaded
        - validation_pending
        - restart_required
        - rolled_back
      properties:
        service:
          type: string
        path:
          type: string
        action:
          type: string
          enum: [apply, reset]
        changed:
          type: boolean
        resolution:
          type: string
        backup_path:
          type: string
        restored_from:
          type: string
        detached:
          type: boolean
        hash:
          type: string
        size:
          type: integer
          format: int64
        active:
          type: boolean
        live:
          type: boolean
          description: True only after a successful validation and reload of an active service.
        reloaded:
          type: boolean
        validation_pending:
          type: boolean
        restart_required:
          type: boolean
        rolled_back:
          type: boolean
        message:
          type: string

    ServiceView:
      type: object
      required: [id, display_name, group, state, active, image, health, container_id, installed]
      properties:
        id:
          type: string
        display_name:
          type: string
        group:
          type: string
          enum: [web, mysql-family, standalone]
        state:
          type: string
          enum:
            - not_installed
            - installed
            - installed_but_stopped
            - starting
            - active
            - stopping
            - error
        active:
          type: boolean
        image:
          type: string
        installed:
          type: boolean
          description: Image and scaffold are present; independent of active.
        health:
          type: string
          description: Container health or an empty string when no health check applies.
        container_id:
          type: string
        ports:
          type: array
          items:
            $ref: "#/components/schemas/ServicePort"
        last_error:
          type: string
        config_path:
          type: string
        data_path:
          type: string
