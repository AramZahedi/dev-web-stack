        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The helper reported a service conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HelperServiceUnavailable"
        "500":
          $ref: "#/components/responses/HelperError"

  /api/v1/services/{id}/restart:
    post:
      tags: [services]
