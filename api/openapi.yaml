            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceApplyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          description: Apply failed; details.result carries the per-step result and rollback path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HelperServiceUnavailable"

  /api/v1/performance/reset:
