      operationId: rotateServiceCredentials
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
      responses:
        "200":
          description: The rotated service credentials.
          content:
            application/json:
