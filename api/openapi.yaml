openapi: 3.1.0
info:
  title: devstack local API
  version: 0.1.0
  description: |
    Loopback-only REST API for the devstack daemon. Every request must use an
    allowed Host header (127.0.0.1, localhost, or devstack.test, with any
    numeric port); foreign hosts receive 403 before authentication or routing.

    All API requests except `/api/v1/health` and the `/api/v1/auth`
    bootstrap require the per-install dashboard token, supplied as the
    `X-Devstack-Token` header or the HttpOnly `devstack_auth` cookie that
    `POST /api/v1/auth` issues. The token is stored DPAPI-protected on Windows
    and as a 0600 file elsewhere. `devstack ui` opens the dashboard with the
    token in the URL fragment; the browser exchanges it for the cookie.

    Read-only API GETs and SSE streams do not require a session cookie after
    the install-token gate: the listener is loopback-only and every request has
    already passed the Host allowlist. Mutations (POST, PATCH, DELETE) require
    the `devstack_session` cookie and the matching `X-CSRF-Token`;
    `GET /api/v1/session` creates the cookie when absent and returns that
    token. CLI requests over the Unix domain socket are authenticated by peer
    credentials through `WithSocketAuth` and do not need the token, cookie, or
    the CSRF header, but they still pass the Host allowlist.

    Server-sent events (logs and events) use `data: <json>\n\n` frames with
    comment keepalives every 15 seconds. The API request-body guard is
    configured separately from the machine's `max_request_body_mb` setting and
    defaults to 1024 MiB.
servers:
  - url: http://127.0.0.1:7070
    description: Dashboard/API listener
  - url: http://localhost:7070
    description: Dashboard/API listener (localhost)
  - url: http://devstack.test
    description: Dashboard host through the local proxy
security: []
tags:
  - name: health
  - name: session
  - name: sites
  - name: php
  - name: node
  - name: tools
  - name: events
  - name: runtimes
  - name: trust
  - name: doctor
  - name: filesystem
  - name: settings
  - name: vhosts
  - name: services
  - name: performance
  - name: terminal
  - name: dashboard
paths:
  /api/v1/health:
    get:
      tags: [health]
      summary: Report daemon health and version
      operationId: health
      security: []
      responses:
        "200":
          description: The daemon is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "403":
          $ref: "#/components/responses/ForbiddenHost"

  /api/v1/auth:
    post:
      tags: [session]
      summary: Exchange the per-install token for an auth cookie
      description: |
        Validates the per-install dashboard token and sets the HttpOnly
        `devstack_auth` cookie. The token may also be supplied in the cookie
        (idempotent re-auth). This route is reachable without an existing
        token only to report 403; it is exempt from the session/CSRF check.
      operationId: authenticateDashboard
      security: []
      parameters:
        - in: header
          name: X-Devstack-Token
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The auth cookie was set.
          headers:
            Set-Cookie:
              description: The HttpOnly devstack_auth cookie.
              schema:
                type: string
        "403":
          description: Missing or invalid install token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/session:
    get:
      tags: [session]
      summary: Create or read the dashboard session
      description: |
        Sets the `devstack_session` cookie when absent and returns the CSRF
        token for the presented session. The cookie is HttpOnly, SameSite=Strict,
        and Secure when the request is TLS or carries X-Forwarded-Proto https.
      operationId: getSession
      security: []
      responses:
        "200":
          description: The session's CSRF token.
          headers:
            Set-Cookie:
              description: Present only when a new session was created.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          $ref: "#/components/responses/ForbiddenHost"

  /api/v1/sites:
    get:
      tags: [sites]
      summary: List sites
      operationId: listSites
      security: []
      responses:
        "200":
          description: Sites ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Site"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [sites]
      summary: Create and start a site
      operationId: createSite
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteRequest"
      responses:
        "201":
          description: The created site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Domain conflict, hosts-sync failure, or port conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request body exceeds the configured limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sites/{ref}:
    parameters:
      - $ref: "#/components/parameters/SiteRef"
    get:
      tags: [sites]
      summary: Get one site
      operationId: getSite
      security: []
      responses:
        "200":
          description: The requested site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [sites]
      summary: Partially update a site
      operationId: updateSite
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteRequest"
      responses:
        "200":
          description: The updated site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Domain conflict or hosts-sync failure.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [sites]
      summary: Stop and delete a site
      operationId: deleteSite
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: The site was deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Hosts synchronization failed; the stopped row was kept for retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sites/{ref}/source:
    parameters:
      - $ref: "#/components/parameters/SiteRef"
    post:
      tags: [sites]
      summary: Change a site's source mode and copy source files
      operationId: changeSiteSourceMode
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeSiteSourceRequest"
      responses:
        "200":
          description: The updated site after verified source copy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict, such as changing source mode while the site is running or destination conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          description: Removing source files after copy is blocked/unsupported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Source copy service or agent is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/sites/{ref}/start:
    parameters:
      - $ref: "#/components/parameters/SiteRef"
    post:
      tags: [sites]
      summary: Start a site
      operationId: startSite
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "202":
          description: The start action completed.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sites/{ref}/stop:
    parameters:
      - $ref: "#/components/parameters/SiteRef"
    post:
      tags: [sites]
      summary: Stop a site
      operationId: stopSite
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "202":
          description: The stop action completed.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sites/{ref}/restart:
    parameters:
      - $ref: "#/components/parameters/SiteRef"
    post:
      tags: [sites]
      summary: Restart a site
      operationId: restartSite
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "202":
          description: The restart action completed.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sites/{ref}/terminal/session:
    parameters:
      - $ref: "#/components/parameters/SiteRef"
    post:
      tags: [sites, terminal]
      summary: Issue a site terminal ticket
      description: |
        Creates a cryptographically random, one-use ticket bound to the site ID
        and the installing user's UID. The ticket expires within 30 seconds and
        is consumed by the WebSocket upgrade. Issuance requires the normal
        dashboard session and CSRF token. The ticket value is never logged.
      operationId: createSiteTerminalSession
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: A one-use ticket for the site terminal WebSocket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminalTicket"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The site project or document root is missing or escapes through a symlink.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: A concurrent terminal session limit was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The terminal manager is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/sites/{ref}/terminal:
    parameters:
      - $ref: "#/components/parameters/SiteRef"
      - name: ticket
        in: query
        required: true
        description: One-use ticket returned by POST /sites/{ref}/terminal/session.
        schema:
          type: string
    get:
      tags: [sites, terminal]
      summary: Open a site-scoped PTY over WebSocket
      description: |
        Upgrades an authenticated request to a WebSocket-backed PTY. The ticket
        is the capability and must be fresh (<= 30 s) and unused. Origin must be
        an allowed loopback dashboard host; a missing, `null`, or foreign Origin
        is rejected with 403. On Linux the socket runs the installing user's
        shell in the site project root with the site's PHP/Node shims, PHPRC, and
        site environment, never as root or through sudo. On Windows the session
        is hosted by the WSL agent's PTY, which runs inside the managed distro;
        that agent currently runs as root, so Windows terminal sessions are
        root shells within the distro.

        Text frames are JSON:

        Client to server:
        - `{"type":"input","data":"..."}` writes UTF-8 input to the PTY.
        - `{"type":"resize","cols":80,"rows":24}` resizes the PTY (1-1000).

        Server to client:
        - `{"type":"output","data":"..."}` carries PTY output.
        - `{"type":"exit","code":0}` is the final frame on a normal shell exit.
          A non-exit termination adds `reason`: `idle_timeout`, `max_duration`,
          `output_limit`, or `shutdown`.
        - `{"type":"error","message":"..."}` reports a recoverable protocol error.

        Binary frames are accepted as raw PTY input. Limits: 4 total sessions,
        2 per site/user, 30-minute idle timeout, 4-hour absolute maximum, and
        4 MiB of output per session. Disconnecting kills the shell's process
        group. Audit logs record start/stop, site, UID, duration, and exit
        status only; keystrokes and output are never logged.
      operationId: openSiteTerminal
      security: []
      responses:
        "101":
          description: Switching Protocols; the WebSocket PTY session follows.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: Missing, expired, reused, or wrong-site ticket, or a disallowed Origin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The site project or document root is missing or escapes through a symlink.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: A concurrent terminal session limit was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The terminal manager is not configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/sites/{ref}/logs/stream:
    parameters:
      - $ref: "#/components/parameters/SiteRef"
      - name: follow
        in: query
        required: false
        description: |
          When true (the default), keep the subscription open and stream new
          lines. When false, return the recent buffered lines and close the
          response immediately.
        schema:
          type: boolean
          default: true
    get:
      tags: [sites]
      summary: Stream or snapshot log lines for a site
      description: |
        Server-sent event stream. Each data frame is a LogLine. With
        follow=true the subscription ends when the client disconnects; with
        follow=false the response contains the recent snapshot and ends.
      operationId: streamSiteLogs
      security: []
      responses:
        "200":
          description: A text/event-stream of log lines.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            X-Accel-Buffering:
              schema:
                type: string
                enum: ["no"]
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/LogLine"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sites/{ref}/php:
    get:
      tags: [sites, php]
      summary: Get a site's effective PHP configuration
      operationId: getSitePHP
      security: []
      parameters:
        - $ref: "#/components/parameters/SiteRef"
      responses:
        "200":
          description: The persisted row, pinned build, defaults, extensions, and rendered configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PHPInfo"
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [sites, php]
      summary: Merge and apply a site PHP configuration change
      description: |
        Empty version/build keep the current values. Absent extension/ini maps
        and an absent ini_raw keep the current overrides; present values
        (including empty ones) replace them. A running site validates the new
        generation before swapping its FPM master.
      operationId: applySitePHP
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/SiteRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PHPChangeRequest"
      responses:
        "200":
          description: The updated site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No installed build can satisfy the requested PHP line or build id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The generated php.ini or php-fpm configuration is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sites/{ref}/php/exec:
    post:
      tags: [sites, php]
      summary: Run the site's PHP binary
      description: |
        Forwards only the supplied argv after the generated `-c php.ini`.
        Arguments that would bypass the generated ini (`-n`, `-c`, or
        `--php-ini`) are rejected.
      operationId: execSitePHP
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/SiteRef"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PHPExecRequest"
      responses:
        "200":
          description: The PHP process result. A non-zero exit code is a successful API call.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PHPExecResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No installed PHP build can satisfy the site's configured line.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sites/{ref}/build:
    parameters:
      - $ref: "#/components/parameters/SiteRef"
    post:
      tags: [sites]
      summary: Run a static site's native build
      operationId: buildSite
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: The build result, including success, duration, log, and output path.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A conflicting state prevents the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sites/{ref}/build/logs:
    parameters:
      - $ref: "#/components/parameters/SiteRef"
      - name: tail
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
    get:
      tags: [sites]
      summary: Read the newest build log
      operationId: getBuildLogs
      security: []
      responses:
        "200":
          description: The newest build log and its bounded tail.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/php/default:
    get:
      tags: [php]
      summary: Get the machine-wide PHP CLI default
      operationId: getPHPDefault
      security: []
      responses:
        "200":
          description: The configured selection, resolved build, and shim state.
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [php]
      summary: Set or clear the machine-wide PHP CLI default
      operationId: setPHPDefault
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                clear:
                  type: boolean
                force:
                  type: boolean
      responses:
        "200":
          description: The updated default and shim state.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A conflicting state prevents the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/node/default:
    get:
      tags: [node]
      summary: Get the machine-wide Node CLI default
      operationId: getNodeDefault
      security: []
      responses:
        "200":
          description: The configured selection, resolved build, and shim state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDefaultStatus"
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      tags: [node]
      summary: Set or clear the machine-wide Node CLI default
      operationId: setNodeDefault
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
                clear:
                  type: boolean
                force:
                  type: boolean
      responses:
        "200":
          description: The updated default and shim state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDefaultStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A conflicting state prevents the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/php/default/ini:
    get:
      tags: [php]
      summary: Read the machine-wide CLI php.ini
      operationId: getGlobalIni
      security: []
      responses:
        "200":
          description: The global ini path, content, and selected build.
        "409":
          description: A conflicting state prevents the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [php]
      summary: Replace the machine-wide CLI php.ini
      operationId: saveGlobalIni
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "200":
          description: The saved global ini.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A conflicting state prevents the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tools:
    get:
      tags: [php]
      summary: List managed native tools
      operationId: listTools
      security: []
      responses:
        "200":
          description: The managed PHP and Composer shim state.
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/tools/{id}/install:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          enum: [php-default, composer]
    post:
      tags: [php]
      summary: Install a managed native tool
      operationId: installTool
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
      responses:
        "200":
          description: The installed tool status.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A conflicting state prevents the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/tools/{id}/remove:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          enum: [php-default, composer]
    post:
      tags: [php]
      summary: Remove a managed native tool
      operationId: removeTool
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: The remaining tool status.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A conflicting state prevents the operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/php/extensions:
    get:
      tags: [php]
      summary: List PHP extensions available on one line
      operationId: listPHPExtensions
      security: []
      parameters:
        - name: version
          in: query
          required: true
          description: PHP major.minor line (8.2, 8.3, 8.4, or 8.5).
          schema:
            type: string
            examples: ["8.4"]
      responses:
        "200":
          description: Extensions that support the line, sorted by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PHPExtension"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/php/defaults/{version}:
    get:
      tags: [php]
      summary: Get the editable defaults for one PHP line
      operationId: getPHPDefaults
      security: []
      parameters:
        - $ref: "#/components/parameters/PHPVersion"
      responses:
        "200":
          description: The version's ini and extension defaults.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PHPDefaults"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [php]
      summary: Save defaults and re-apply them to running sites
      operationId: savePHPDefaults
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/PHPVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PHPDefaultsRequest"
      responses:
        "200":
          description: The saved defaults and per-site apply outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PHPDefaultsResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The defaults contain an invalid ini directive or extension.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/php/migrate:
    post:
      tags: [php]
      summary: Migrate every site on a PHP line to a target build
      operationId: migratePHP
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PHPMigrationRequest"
      responses:
        "200":
          description: One result per affected site.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PHPMigrationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The target PHP build is not installed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/events:
    get:
      tags: [events]
      summary: Stream daemon diagnostic events
      description: |
        Server-sent event stream. The store is polled once per second and new
        events are emitted in ascending ID order. Keepalive comments are sent
        every 15 seconds.
      operationId: streamEvents
      security: []
      responses:
        "200":
          description: A text/event-stream of events.
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
            X-Accel-Buffering:
              schema:
                type: string
                enum: ["no"]
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/runtimes:
    get:
      tags: [runtimes]
      summary: List installed runtime builds
      operationId: listRuntimes
      security: []
      responses:
        "200":
          description: Installed builds ordered by kind and version.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuntimeBuild"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/runtimes/available:
    get:
      tags: [runtimes]
      summary: List catalog builds that can be installed
      operationId: availableRuntimes
      security: []
      responses:
        "200":
          description: Checksum-pinned catalog entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/runtimes/install:
    post:
      tags: [runtimes]
      summary: Download, verify, and install a runtime build
      operationId: installRuntime
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallRuntimeRequest"
      responses:
        "201":
          description: The installed build.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeBuild"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The requested build is not in the pinned catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/runtimes/node/releases:
    get:
      tags: [runtimes]
      summary: List available Node releases grouped by major
      operationId: listNodeReleases
      security: []
      parameters:
        - name: major
          in: query
          required: false
          description: Restrict to one major version.
          schema:
            type: string
        - name: all
          in: query
          required: false
          description: Expand every stable release in each major.
          schema:
            type: boolean
        - name: offline
          in: query
          required: false
          description: Use cache or the embedded catalog without a network call.
          schema:
            type: boolean
      responses:
        "200":
          description: Node release snapshot with source, staleness, and warning state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeSnapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "502":
          description: The upstream discovery source failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/runtimes/node/releases/{version}:
    parameters:
      - name: version
        in: path
        required: true
        description: Node version selector or exact release.
        schema:
          type: string
    get:
      tags: [runtimes]
      summary: Preflight one exact Node release
      operationId: getNodeRelease
      security: []
      responses:
        "200":
          description: The pinned catalog entry and release metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodePreflight"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The upstream discovery source failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/runtimes/node/refresh:
    post:
      tags: [runtimes]
      summary: Refresh the official Node release index
      operationId: refreshNodeReleases
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: The refreshed snapshot, or a stale/embedded fallback with a warning.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeSnapshot"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: The upstream discovery source failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/runtimes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Installed runtime build id.
        schema:
          type: string
    delete:
      tags: [runtimes]
      summary: Remove an installed runtime build
      operationId: removeRuntime
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: The build was removed (or was already absent).
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/trust:
    get:
      tags: [trust]
      summary: Report CA trust per target
      operationId: trustStatus
      security: []
      responses:
        "200":
          description: One result per trust store or browser profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustTargets"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/HelperUnavailable"
    delete:
      tags: [trust]
      summary: Remove the devstack CA from user trust stores
      operationId: removeTrust
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: One result per trust store or browser profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustTargets"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/HelperUnavailable"

  /api/v1/trust/repair:
    post:
      tags: [trust]
      summary: Install the devstack CA into user trust stores
      operationId: repairTrust
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: One result per trust store or browser profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustTargets"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          $ref: "#/components/responses/HelperUnavailable"

  /api/v1/doctor:
    get:
      tags: [doctor]
      summary: Run doctor checks
      operationId: runDoctorChecks
      security: []
      responses:
        "200":
          description: The doctor report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/doctor/run:
    post:
      tags: [doctor]
      summary: Run doctor checks
      operationId: runDoctor
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: The doctor report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorReport"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/doctor/repair:
    post:
      tags: [doctor]
      summary: Re-apply idempotent repairs and rerun checks
      operationId: repairDoctor
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: The refreshed doctor report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorReport"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/vhosts/status:
    get:
      tags: [vhosts]
      summary: Report the helper-managed external serving state
      description: |
        Reports the helper's persisted mode, server version, bridge state,
        config-test result, current release, and last sync. Read-only requests
        do not require a session.
      operationId: getVhostStatus
      security: []
      responses:
        "200":
          description: Current vhost status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VhostStatus"
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/vhosts/mode:
    post:
      tags: [vhosts]
      summary: Switch the serving mode
      description: |
        Switches between builtin, nginx, and apache. The daemon stops or starts
        the built-in proxy and static backends as required and persists the
        mode only after the helper succeeds. Returns the refreshed status.
      operationId: setVhostMode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VhostModeRequest"
      responses:
        "200":
          description: The refreshed vhost status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VhostStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The mode is unavailable, a sync is busy, or the bridge include is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The rendered configuration failed the server config test.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/vhosts/sync:
    post:
      tags: [vhosts]
      summary: Reinstall the complete vhost set
      operationId: syncVhosts
      responses:
        "200":
          description: The refreshed vhost status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VhostStatus"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The mode is unavailable, a sync is busy, or the bridge include is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The rendered configuration failed the server config test.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The vhost sync failed and the previous release was restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The server reload failed and the previous release was restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/vhosts/preview:
    get:
      tags: [vhosts]
      summary: Render one site vhost without installing it
      description: |
        Renders the site's nginx or Apache configuration as plain text. The
        preview never writes vhost files and never calls the helper.
      operationId: previewVhost
      security: []
      parameters:
        - name: site
          in: query
          required: true
          description: Site id or name.
          schema:
            type: string
        - name: server
          in: query
          required: true
          schema:
            type: string
            enum: [nginx, apache]
      responses:
        "200":
          description: The rendered site vhost.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VhostPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/fs:
    get:
      tags: [filesystem]
      summary: List subdirectories for the project picker
      description: |
        Absolute directories only. Files are never listed and file contents are
        never returned. When the server has a configured user home, paths are
        resolved through symlinks and confined to that home.
      operationId: browseFilesystem
      security: []
      parameters:
        - name: path
          in: query
          required: true
          description: Absolute directory path.
          schema:
            type: string
      responses:
        "200":
          description: Sorted child directories.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FsListing"
        "400":
          description: Missing, relative, non-directory, or unreadable path.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Path is outside the configured user home.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/settings:
    get:
      tags: [settings]
      summary: Report machine settings
      operationId: getSettings
      security: []
      responses:
        "200":
          description: Effective machine settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [settings]
      summary: Update listener ports
      description: |
        Updates one or more daemon listener ports in config.yaml. Omitted
        fields are unchanged. A changed listener is persisted but is not
        rebound inside this request; the response sets restart_required and
        the caller uses `devstack daemon restart`. Ports must be distinct,
        outside the reserved backend range, and bindable on loopback.
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdateRequest"
      responses:
        "200":
          description: Persisted settings, including restart guidance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsUpdateResponse"
        "400":
          description: Invalid port value, duplicate ports, or reserved range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A requested port is already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The settings could not be loaded or persisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/services:
    get:
      tags: [services]
      summary: List services
      operationId: listServices
      security: []
      responses:
        "200":
          description: Combined view of catalog services and stored state.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceView"
        "403":
          $ref: "#/components/responses/ForbiddenHost"

  /api/v1/services/{id}:
    get:
      tags: [services]
      summary: Get service by ID
      operationId: getService
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Service view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceView"
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [services]
      summary: Uninstall a service
      description: |
        Stops and removes the service container. Data is preserved unless
        `delete_data` is true; the helper writes and verifies a backup before
        deleting anything. An empty body keeps the default `false`.
      operationId: uninstallService
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UninstallServiceRequest"
      responses:
        "200":
          description: The uninstall completed; backup_path is present when a backup was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UninstallServiceResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/HelperServiceUnavailable"
        "500":
          $ref: "#/components/responses/HelperError"

  /api/v1/services/{id}/install:
    post:
      tags: [services]
      summary: Pull the image and scaffold a service
      operationId: installService
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
      responses:
        "200":
          description: The service is installed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The helper reported a service conflict (ports, exclusive group, or health).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HelperServiceUnavailable"
        "500":
          $ref: "#/components/responses/HelperError"

  /api/v1/services/{id}/activate:
    post:
      tags: [services]
      summary: Activate a service
      description: |
        Serialized by the helper, which stops the conflicting member of an
        exclusive group (nginx/apache, mysql/mariadb) before starting this one.
      operationId: activateService
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
      responses:
        "200":
          description: The service is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The helper reported SERVICE_CONFLICT: an exclusive-group member,
            host port, or container health blocked activation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HelperServiceUnavailable"
        "500":
          $ref: "#/components/responses/HelperError"

  /api/v1/services/{id}/deactivate:
    post:
      tags: [services]
      summary: Deactivate a service
      operationId: deactivateService
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
      responses:
        "200":
          description: The service is stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The helper reported a service conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HelperServiceUnavailable"
        "500":
          $ref: "#/components/responses/HelperError"

  /api/v1/services/{id}/restart:
    post:
      tags: [services]
      summary: Restart a service
      operationId: restartService
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
      responses:
        "200":
          description: The service restarted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceActionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The helper reported a service conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HelperServiceUnavailable"
        "500":
          $ref: "#/components/responses/HelperError"

  /api/v1/services/{id}/logs:
    get:
      tags: [services]
      summary: Read bounded service container logs
      operationId: getServiceLogs
      security: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
        - name: tail
          in: query
          required: false
          description: Number of trailing log lines; zero uses the helper default.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: The bounded log tail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLogs"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/HelperServiceUnavailable"
        "500":
          $ref: "#/components/responses/HelperError"

  /api/v1/services/{id}/credentials/reveal:
    post:
      tags: [services]
      summary: Reveal a service's credentials
      description: |
        Explicit credential reveal. Credentials never appear in list or get
        responses and are never written to service logs.
      operationId: revealServiceCredentials
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
      responses:
        "200":
          description: The service credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCredentials"
        "400":
          description: The service has no credential flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/services/{id}/credentials/rotate:
    post:
      tags: [services]
      summary: Rotate a service's credentials
      description: |
        Regenerates the credentials and returns them once. The caller must
        confirm the rotation; the dashboard and CLI do so explicitly.
      operationId: rotateServiceCredentials
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
      responses:
        "200":
          description: The rotated service credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCredentials"
        "400":
          description: The service has no credential flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/services/{id}/config:
    get:
      tags: [services]
      summary: List service config file metadata
      description: |
        Returns path, class, generated/modified/detached markers, hash, size,
        and conflict summary for every allowed regular file under
        `<home>/services/<id>/config`. Contents are never included.
      operationId: listServiceConfig
      security: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
      responses:
        "200":
          description: Config file metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceConfigListing"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The service is not installed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/services/{id}/config/content:
    get:
      tags: [services]
      summary: Read one service config file
      description: |
        Returns content only for a config file inside the service config root.
        Path traversal, absolute paths, symlinks, non-regular files, sensitive
        names, and files over 1 MiB are rejected.
      operationId: getServiceConfigContent
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
        - name: path
          in: query
          required: true
          description: Slash-relative path below the service config root.
          schema:
            type: string
            examples: ["nginx.conf", "conf.d/custom/extra.conf"]
      responses:
        "200":
          description: The allowed file and its content.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceConfigContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The service is not installed or the path is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The file exceeds the 1 MiB config limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/services/{id}/config/diff:
    post:
      tags: [services]
      summary: Diff a proposed service config change
      description: |
        Returns a unified diff plus conflict metadata. A tracked generated file
        whose current hash differs from the manifest reports
        `conflict.resolution_required: true`.
      operationId: diffServiceConfig
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceConfigDiffRequest"
      responses:
        "200":
          description: The unified diff and conflict metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceConfigDiff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The service is not installed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The proposed content exceeds the 1 MiB config limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/services/{id}/config/apply:
    post:
      tags: [services]
      summary: Apply a service config change
      description: |
        Backs up the current file, writes atomically, and tracks conflicts.
        A tracked generated conflict requires `resolution` keep, use, or merge.
        An active service with a catalog validation command is validated first
        and reloaded only after validation; validation or reload failure
        restores the previous file. Inactive services are marked
        `validation_pending` and never reported live.
      operationId: applyServiceConfig
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceConfigApplyRequest"
      responses:
        "200":
          description: The write outcome, backup, and live/validation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceConfigApplyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            A tracked config conflict requires keep/use/merge, or the service
            is not installed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The content exceeds the 1 MiB config limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The catalog validation command rejected the new config; the previous file was restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: The service reload failed; the previous file was restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HelperUnavailable"

  /api/v1/services/{id}/config/reset:
    post:
      tags: [services]
      summary: Reset a service config file from its newest backup
      description: |
        Backs up the current file and restores the newest previous backup. An
        untracked custom file is never deleted without a backup.
      operationId: resetServiceConfig
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceConfigResetRequest"
      responses:
        "200":
          description: The reset outcome, backup, and live/validation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceConfigApplyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: No previous backup exists, or the service is not installed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Validation failed; the current file was restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: Reload failed; the current file was restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          $ref: "#/components/responses/HelperUnavailable"


  /api/v1/performance:
    get:
      tags: [performance]
      summary: Read the throughput profile and measured resources
      operationId: getPerformance
      security: []
      responses:
        "200":
          description: Persisted profile, measured resources, applied state, and host tuning status.
