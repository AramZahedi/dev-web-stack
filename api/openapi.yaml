        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/performance/preview:
    get:
      tags: [performance]
      summary: Preview generated includes and host tuning without writing
