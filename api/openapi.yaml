  /api/v1/performance/apply:
    post:
      tags: [performance]
      summary: Apply the persisted performance profile
      description: |
        Requires `confirm:true`. Host-wide sysctl/limits tuning is a separate
        explicit `host_tuning:true` opt-in. Database-only installs skip web
        includes. Returns per-step results and a rollback path.
      operationId: applyPerformance
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
