        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /:
    get:
      tags: [dashboard]
      summary: Serve the dashboard SPA
      description: |
        Serves index.html for application routes and static files that exist in
        the embedded dashboard. Assets under /assets/ are served separately.
      operationId: dashboardIndex
      security: []
      responses:
        "200":
          description: Dashboard HTML or a static file.
          content:
            text/html:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "404":
          description: The dashboard build is not present.

  /assets/{path}:
    get:
      tags: [dashboard]
      summary: Serve a hashed dashboard asset
      operationId: dashboardAsset
      security: []
      parameters:
        - name: path
          in: path
          required: true
          description: Asset path below /assets/.
          schema:
            type: string
      responses:
        "200":
          description: The asset with its MIME type.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "404":
          description: The asset does not exist.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: devstack_session
      description: |
        Random 32-byte session value created by GET /api/v1/session. Required
        for mutations; read-only GETs and SSE streams do not need it.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        HMAC-SHA256(server secret, session) returned by GET /api/v1/session.
        Required for cookie-authenticated mutations.
    socketPeerAuth:
      type: apiKey
      in: header
      name: X-Devstack-Socket
      description: |
        Documentation-only marker for the Unix-socket transport. The server
        authenticates socket peers with SO_PEERCRED via WithSocketAuth and does
        not read this header.

  parameters:
    SiteRef:
      name: ref
      in: path
      required: true
      description: Site id or unique site name.
      schema:
        type: string
    PHPVersion:
      name: version
      in: path
      required: true
      description: PHP major.minor line (8.2, 8.3, 8.4, or 8.5).
      schema:
        type: string
        examples: ["8.4"]
    ServiceID:
      name: id
      in: path
      required: true
      description: Catalog service id (for example nginx, mysql, redis).
      schema:
        type: string
        examples: [nginx]

  responses:
    BadRequest:
      description: Invalid JSON, missing field, or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The dashboard session cookie is missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: CSRF token is missing or invalid, or the Host header is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ForbiddenHost:
      description: The Host header is not in the loopback allowlist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Unexpected daemon failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HelperUnavailable:
      description: The privileged helper is unreachable or rejected the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HelperError:
      description: |
        The privileged helper returned a structured internal failure
        (HELPER_ERROR) rather than a transport failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: The requested service is not configured in this daemon.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    HelperServiceUnavailable:
      description: The privileged service helper is unreachable or unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: The path exists but does not accept this HTTP method.
      headers:
        Allow:
          description: Comma-separated methods supported by the path.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          examples:
            - INVALID_REQUEST
            - NOT_FOUND
            - DOMAIN_CONFLICT
            - HOSTS_SYNC_FAILED
            - RUNTIME_MISSING
            - PHP_VERSION_IN_USE
            - PHP_CONFIG_INVALID
            - TRUST_MISSING
            - PORT_IN_USE
            - PAYLOAD_TOO_LARGE
            - FORBIDDEN
            - UNAUTHORIZED
            - HELPER_UNAVAILABLE
            - HELPER_ERROR
            - SERVICE_CONFLICT
            - METHOD_NOT_ALLOWED
            - INTERNAL
        message:
          type: string
          description: Human-readable explanation.
        details:
          description: Optional structured context.

    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          examples: [ok]
        version:
          type: string
          examples: [dev]

    Session:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          description: HMAC-SHA256(server secret, session) in lowercase hex.

    SiteKind:
      type: string
      enum: [static, php, node]

    BackendKind:
      type: string
      enum: [local, wsl]

    DesiredState:
      type: string
      enum: [running, stopped]

    SiteStatus:
      type: string
      enum: [stopped, starting, running, stopping, crashed, error]

    Site:
      type: object
      required:
        - id
        - name
        - domain
        - www
        - backend
        - host_path
        - backend_path
        - kind
        - desired_state
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
        name:
          type: string
        domain:
          type: string
          examples: [blog.test]
        www:
          type: boolean
        backend:
          $ref: "#/components/schemas/BackendKind"
        host_path:
          type: string
        backend_path:
          type: string
        kind:
          $ref: "#/components/schemas/SiteKind"
        php_version:
          type: string
        php_build:
          type: string
        php_extensions:
          type: object
          additionalProperties:
            type: boolean
        php_ini:
          type: object
          additionalProperties:
            type: string
        php_ini_raw:
          type: string
        php_config_hash:
          type: string
        node_version:
          type: string
        command:
          type: string
        env:
          type: object
          additionalProperties:
            type: string
        document_root:
          type: string
        front_controller:
          type: boolean
        spa_fallback:
          type: boolean
        tls:
          type: boolean
        force_https:
          type: boolean
        desired_state:
          $ref: "#/components/schemas/DesiredState"
        status:
          $ref: "#/components/schemas/SiteStatus"
        http_port:
          type: integer
          minimum: 0
        fastcgi_port:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSiteRequest:
      type: object
      required: [name, path, kind]
      properties:
        name:
          type: string
          description: Unique site name; the domain is derived as <name>.test.
        path:
          type: string
          description: Absolute project directory on the host.
        host_path:
          type: string
          description: Alias for path, accepted for the M1 appendix shape.
        kind:
          $ref: "#/components/schemas/SiteKind"
        node_version:
          type: string
        command:
          type: string
        document_root:
          type: string
        php_version:
          type: string
          description: PHP major.minor line; required for php sites.
        php_build:
          type: string
          description: Installed build id; omitted selects the newest installed build for the line.
        php_extensions:
          type: object
          additionalProperties:
            type: boolean
        php_ini:
          type: object
          additionalProperties:
            type: string
        php_ini_raw:
          type: string
        front_controller:
          type: boolean
        front_controller_file:
          type: string
          description: Relative PHP front-controller file (for example public/index.php).
        front_controller_mode:
          type: string
          enum: [auto, generated, htaccess]
        apache_allow_override:
          type: string
          enum: [all, fileinfo, none]
        spa_fallback:
          type: boolean
        spa_fallback_file:
          type: string
          description: Relative fallback file served for non-file paths (for example app.html).
        build:
          $ref: "#/components/schemas/BuildProfile"
        www:
          type: boolean
        tls:
          type: boolean
        force_https:
          type: boolean
        env:
          type: object
          additionalProperties:
            type: string

    BuildProfile:
      type: object
      description: Optional client-side asset build profile.
      required: [node_version, command]
      properties:
        node_version:
          type: string
        command:
          type: string
        output:
          type: string
        env:
          type: object
          additionalProperties:
            type: string

    UpdateSiteRequest:
      type: object
      description: Omitted scalar fields are unchanged. An empty env object clears the environment.
      properties:
        domain:
          type: string
        www:
          type: boolean
        tls:
          type: boolean
        force_https:
          type: boolean
        spa_fallback:
          type: boolean
        front_controller:
          type: boolean
        command:
          type: string
        document_root:
          type: string
        env:
          type: object
          additionalProperties:
            type: string

    PHPChangeRequest:
      type: object
      description: |
        Empty version/build keep the current values. Absent maps and an absent
        ini_raw keep the current overrides; present values replace them.
      properties:
        version:
          type: string
          description: PHP major.minor line.
        build:
          type: string
          description: Installed build id.
        extensions:
          type: object
          additionalProperties:
            type: boolean
        ini:
          type: object
          additionalProperties:
            type: string
        ini_raw:
          type: string
          nullable: true

    PHPExecRequest:
      type: object
      required: [argv]
      properties:
        argv:
          type: array
          items:
            type: string
          description: Arguments forwarded to the site's PHP binary.

    PHPExecResult:
      type: object
      required: [exit_code, stdout, stderr]
      properties:
        exit_code:
          type: integer
        stdout:
          type: string
        stderr:
          type: string

    PHPExtension:
      type: object
      required: [name, type, so, default, standard, versions]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [extension, zend_extension]
        so:
          type: string
        default:
          type: boolean
        standard:
          type: boolean
        versions:
          type: array
          items:
            type: string
        requires:
          type: array
          items:
            type: string

    PHPResolvedExtension:
      type: object
      required: [name, type, so, required]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [extension, zend_extension]
        so:
          type: string
        required:
          type: boolean
          description: True when the extension is enabled by defaults or a dependency.
        required_by:
          type: array
          items:
            type: string

    PHPDefaults:
      type: object
      required: [version, ini, extensions]
      properties:
        version:
          type: string
        ini:
          type: object
          additionalProperties:
            type: string
        extensions:
          type: object
          additionalProperties:
            type: boolean

    PHPDefaultsRequest:
      type: object
      description: The path version is authoritative; a version in the body is ignored.
      properties:
        ini:
          type: object
          additionalProperties:
            type: string
        extensions:
          type: object
          additionalProperties:
            type: boolean

    PHPMigrationResult:
      type: object
      required: [site, ok]
      properties:
        site:
          type: string
        ok:
          type: boolean
        error:
          type: string

    PHPDefaultsResult:
      type: object
      required: [defaults, sites]
      properties:
        defaults:
          $ref: "#/components/schemas/PHPDefaults"
        sites:
          type: array
          items:
            $ref: "#/components/schemas/PHPMigrationResult"

    PHPMigrationRequest:
      type: object
      required: [from_version]
      properties:
        from_version:
          type: string
          description: Source PHP major.minor line.
        to_version:
          type: string
          description: Target line; required unless to_build is supplied.
        to_build:
          type: string
          description: Exact installed target build; also implies the target line.

    PHPInfo:
      type: object
      required:
        - site
        - build
        - defaults
        - extensions
        - available_extensions
        - builtins
        - ini
        - ini_raw
        - generated_ini
        - fpm_config
        - config_hash
      properties:
        site:
          $ref: "#/components/schemas/Site"
        build:
          $ref: "#/components/schemas/RuntimeBuild"
        defaults:
          $ref: "#/components/schemas/PHPDefaults"
        extensions:
          type: array
          items:
            $ref: "#/components/schemas/PHPResolvedExtension"
        available_extensions:
          type: array
          items:
            $ref: "#/components/schemas/PHPExtension"
        builtins:
          type: array
          items:
            type: string
        ini:
          type: object
          additionalProperties:
            type: string
        ini_raw:
          type: string
        generated_ini:
          type: string
        fpm_config:
          type: string
        config_hash:
          type: string

    RuntimeBuild:
      type: object
      required: [id, kind, version, backend, path, checksum, installed_at]
      properties:
        id:
          type: string
        kind:
          type: string
          examples: [node, php]
        version:
          type: string
        backend:
          $ref: "#/components/schemas/BackendKind"
        path:
          type: string
        checksum:
          type: string
        installed_at:
          type: string
          format: date-time

    CatalogEntry:
      type: object
      required: [id, kind, version, build, url, sha256, size]
      properties:
        id:
          type: string
        kind:
          type: string
        version:
          type: string
        build:
          type: string
          examples: [linux-x64]
        url:
          type: string
          format: uri
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        size:
          type: integer
          format: int64

    InstallRuntimeRequest:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Catalog entry id.

    CheckStatus:
      type: string
      enum: [ok, warn, fail, skipped]

    DoctorCheck:
      type: object
      required: [id, title, status, detail, remediation]
      properties:
        id:
          type: string
        title:
          type: string
        status:
          $ref: "#/components/schemas/CheckStatus"
        detail:
          type: string
        remediation:
          type: string

    DoctorReport:
      type: object
      required: [checks, ok]
      properties:
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DoctorCheck"
        ok:
          type: boolean

    TrustTarget:
      type: object
      required: [name, ok, detail]
      properties:
        name:
          type: string
        ok:
          type: boolean
        detail:
          type: string

    TrustTargets:
      type: array
      items:
        $ref: "#/components/schemas/TrustTarget"

    FsEntry:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string

    FsListing:
      type: object
      required: [path, entries]
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/FsEntry"

    Settings:
      type: object
      required:
        - home
        - user_home
        - wsl_distro
        - http_port
        - https_port
        - ui_port
        - auto_start_sites
        - serving_mode
        - serving_provider
        - graceful_stop_seconds
        - max_request_body_mb
        - log_max_mb
        - log_keep
      properties:
        home:
          type: string
          description: Machine root under which devstack keeps state.
        user_home:
          type: string
        wsl_distro:
          type: string
        http_port:
          type: integer
        https_port:
          type: integer
        ui_port:
          type: integer
        auto_start_sites:
          type: boolean
        serving_mode:
          type: string
          enum: [builtin, nginx, apache]
          description: Active serving mode; builtin uses the Go proxy.
        serving_provider:
          type: string
          enum: [native, docker]
          description: |
            native uses host-installed nginx/Apache; docker uses the managed
            service containers. docker requires serving_mode nginx or apache.
        graceful_stop_seconds:
          type: integer
        max_request_body_mb:
          type: integer
          description: |
            Machine config value. The API's actual transport guard is
            Config.MaxBodyBytes, configured separately and defaulting to
            1024 MiB.
        log_max_mb:
          type: integer
        log_keep:
          type: integer
        restart_required:
          type: boolean
          description: |
            True when config.yaml contains listener ports that the running
            daemon has not bound yet. Cleared on daemon startup.

    SettingsUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        http_port:
          type: integer
          minimum: 1
          maximum: 65535
        https_port:
          type: integer
          minimum: 1
          maximum: 65535
        ui_port:
          type: integer
          minimum: 1
          maximum: 65535

    SettingsUpdateResponse:
      allOf:
        - $ref: "#/components/schemas/Settings"
        - type: object
          required: [restart_required]
          properties:
            restart_required:
              type: boolean
              description: True when any listener port changed and a daemon restart is required.
            warnings:
              type: array
              items:
                type: string

    VhostStatus:
      type: object
      required:
        - mode
        - server
        - server_version
        - bridge_path
        - include_present
        - current_release
        - config_ok
        - last_sync
      properties:
        mode:
          type: string
          enum: [builtin, nginx, apache]
        server:
          type: string
        server_version:
          type: string
        bridge_path:
          type: string
        include_present:
          type: boolean
        current_release:
          type: string
        config_ok:
          type: boolean
        last_error:
          type: string
        last_sync:
          type: string
          format: date-time
        service_active:
          type: boolean
          description: Whether the selected nginx/Apache systemd service is active.
        default_server_conflict:
          type: boolean
          description: A foreign server configuration already declares default_server on the devstack listen ports; the devstack 404 vhost is installed without the marker.
        tls_dir:
          type: string
          description: Helper-managed TLS directory reported by the helper.
        tls_dir_mode:
          type: integer
          format: uint32
          description: Permission bits of the TLS directory.
        tls_files:
          type: array
          description: Metadata for files in the helper-managed TLS directory.
          items:
            type: object
            required: [name, mode, regular]
            properties:
              name:
                type: string
              mode:
                type: integer
                format: uint32
              regular:
                type: boolean

    VhostModeRequest:
      type: object
      required: [mode]
      properties:
        mode:
          type: string
          enum: [builtin, nginx, apache]

    VhostPreview:
      type: object
      required: [server, site, content]
      properties:
        server:
          type: string
          enum: [nginx, apache]
        site:
          type: string
        content:
          type: string
          description: Rendered native server configuration as plain text.

    LogLine:
      type: object
      required: [time, site_id, source, text]
      properties:
        time:
          type: string
          format: date-time
        site_id:
          type: string
        source:
          type: string
          examples: [app, fpm, proxy, supervisor]
        text:
          type: string

    Event:
      type: object
      required: [id, type, message, created_at]
      properties:
        id:
          type: integer
          format: int64
        site_id:
          type: string
        type:
          type: string
          examples: [site.running, site.stopped, doctor.repaired]
        message:
          type: string
        created_at:
          type: string
          format: date-time

    ServicePort:
      type: object
      required: [host, container]
      properties:
        host:
          type: integer
        container:
          type: integer
        protocol:
          type: string
        loopback:
          type: boolean

    ServiceActionResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok]

    UninstallServiceRequest:
      type: object
      properties:
        delete_data:
          type: boolean
          default: false
          description: Back up and delete service data after removing the container.

    UninstallServiceResult:
      type: object
      properties:
        backup_path:
          type: string
          description: Path to the verified backup written before data deletion.

    ServiceLogs:
      type: object
      required: [logs]
      properties:
        logs:
          type: string
          description: Bounded container log tail.

    ServiceCredentials:
      type: object
      required: [engine, username, password, database, host, port]
      description: |
        Returned only by the explicit reveal and rotate routes. Credentials are
        never included in list or get responses.
      properties:
        engine:
          type: string
          examples: [mysql]
        username:
          type: string
        password:
          type: string
        database:
          type: string
        host:
          type: string
        port:
          type: integer

    ServiceView:
      type: object
      required: [id, display_name, group, state, active, image, health, container_id, installed]
      properties:
        id:
          type: string
        display_name:
          type: string
        group:
          type: string
          enum: [web, mysql-family, standalone]
        state:
          type: string
          enum:
            - not_installed
            - installed
            - installed_but_stopped
            - starting
            - active
            - stopping
            - error
        active:
          type: boolean
        image:
          type: string
        installed:
          type: boolean
          description: Image and scaffold are present; independent of active.
        health:
          type: string
          description: Container health or an empty string when no health check applies.
        container_id:
          type: string
        ports:
          type: array
          items:
            $ref: "#/components/schemas/ServicePort"
        last_error:
          type: string
        config_path:
          type: string
        data_path:
          type: string
