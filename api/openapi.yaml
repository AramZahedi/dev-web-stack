      responses:
        "200":
          description: The bounded log tail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLogs"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenHost"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/HelperServiceUnavailable"
        "500":
          $ref: "#/components/responses/HelperError"

  /api/v1/services/{id}/credentials/reveal:
    post:
      tags: [services]
      summary: Reveal a service's credentials
      description: |
        Explicit credential reveal. Credentials never appear in list or get
        responses and are never written to service logs.
      operationId: revealServiceCredentials
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/ServiceID"
      responses:
        "200":
          description: The service credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceCredentials"
        "400":
          description: The service has no credential flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/services/{id}/credentials/rotate:
    post:
      tags: [services]
      summary: Rotate a service's credentials
      description: |
        Regenerates the credentials and returns them once. The caller must
