services:
  devstack:
    build:
      context: .
      args:
        PUBLIC_HTTP_PORT: ${DEVSTACK_HOST_HTTP_PORT:-8080}
        PUBLIC_HTTPS_PORT: ${DEVSTACK_HOST_HTTPS_PORT:-8443}
        VERSION: ${DEVSTACK_IMAGE_VERSION:-0.1.0-docker}
    image: devstack:${DEVSTACK_IMAGE_TAG:-0.1.0-docker}
    container_name: devstack
    hostname: devstack
    restart: unless-stopped
    init: false
    stop_grace_period: 30s
    ports:
      - "${DEVSTACK_BIND_ADDRESS:-127.0.0.1}:${DEVSTACK_HOST_HTTP_PORT:-8080}:${DEVSTACK_CONTAINER_HTTP_PORT:-80}"
      - "${DEVSTACK_BIND_ADDRESS:-127.0.0.1}:${DEVSTACK_HOST_HTTPS_PORT:-8443}:${DEVSTACK_CONTAINER_HTTPS_PORT:-443}"
      - "${DEVSTACK_BIND_ADDRESS:-127.0.0.1}:${DEVSTACK_HOST_UI_PORT:-7070}:${DEVSTACK_CONTAINER_UI_PORT:-7070}"
    environment:
      DEVSTACK_PUBLIC_HTTP_PORT: ${DEVSTACK_HOST_HTTP_PORT:-8080}
      DEVSTACK_PUBLIC_HTTPS_PORT: ${DEVSTACK_HOST_HTTPS_PORT:-8443}
      DEVSTACK_HOST_HTTP_PORT: ${DEVSTACK_HOST_HTTP_PORT:-8080}
      DEVSTACK_HOST_HTTPS_PORT: ${DEVSTACK_HOST_HTTPS_PORT:-8443}
      DEVSTACK_HOST_UI_PORT: ${DEVSTACK_HOST_UI_PORT:-7070}
      DEVSTACK_CONTAINER_HTTP_PORT: ${DEVSTACK_CONTAINER_HTTP_PORT:-80}
      DEVSTACK_CONTAINER_HTTPS_PORT: ${DEVSTACK_CONTAINER_HTTPS_PORT:-443}
      DEVSTACK_CONTAINER_UI_PORT: ${DEVSTACK_CONTAINER_UI_PORT:-7070}
      DEVSTACK_INIT: "1"
    volumes:
      - ./.docker-data/devstack:/home/devstack/.devstack
      - ./.docker-data/helper:/var/lib/devstack-helper
      - ./projects:/home/devstack/projects
      - /etc/hosts:/host-hosts
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${DEVSTACK_CONTAINER_UI_PORT}/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
