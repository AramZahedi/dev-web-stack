name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI install, check, test, and build
        working-directory: ui
        run: npm ci && npm run check && npm test && npm run build

      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: UI end-to-end
        working-directory: ui
        run: npm run test:e2e

      # nginx, Apache, and certutil are not used by the Plan 1 E2E yet. They are
      # installed here so later external-vhost and browser-trust tests run on the
      # same Ubuntu 24.04 image. Services are stopped: devstack owns its ports.
      - name: Install Linux E2E tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            apache2 curl libnss3-tools nginx
          sudo systemctl stop nginx apache2 || true
          sudo systemctl disable nginx apache2 || true

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Compile check
        run: go build ./...

      - name: Build release binaries
        run: make build

      # The script uses temporary HOME/state/hosts/trust paths and high ports.
      # It never binds 80/443 or modifies the real trust stores, so no sudo is
      # needed for the E2E flow.
      - name: Linux installer and daemon E2E
        run: E2E_SKIP_BUILD=1 bash test/e2e/linux.sh
