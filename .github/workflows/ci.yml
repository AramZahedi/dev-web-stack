name: CI

# Automatic CI is intentionally disabled to prevent GitHub Actions runs on
# pushes and pull requests. Manual dispatch is still available.
on:
  workflow_dispatch:
    inputs:
      windows:
        description: 'Run the Windows cross-build and test compilation'
        required: false
        default: false
        type: boolean
      windows_native:
        description: 'Run the Windows runner test matrix and packaging'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: UI install, check, test, and build
        working-directory: ui
        run: npm ci && npm run check && npm test && npm run build

      - name: Install Playwright Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: UI end-to-end
        working-directory: ui
        run: npm run test:e2e

      # nginx is used by the external-vhost E2E: the script runs a real nginx
      # from a temporary prefix on high ports and wraps reloads in ${TMP}/bin.
      # Apache and certutil are installed for later external-vhost and
      # browser-trust coverage. Services are stopped and disabled so the test
      # never touches a system server or binds 80/443.
      - name: Install Linux E2E tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            apache2 curl libnss3-tools nginx shellcheck
          sudo systemctl stop nginx apache2 || true
          sudo systemctl disable nginx apache2 || true

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Catalog merge tool tests
        run: go test ./cmd/catalogmerge -count=1

      - name: Compile check
        run: go build ./...

      - name: Build release binaries
        run: make build

      - name: Release, installer, and workflow tests
        run: |
          bash test/release/release_test.sh
          bash test/release/release_windows_test.sh
          bash test/release/installer_test.sh
          bash test/release/workflow_test.sh

      - name: Shell, installer, and unit checks
        run: |
          bash -n install.sh test/e2e/linux.sh build/release.sh build/release-windows.sh test/release/*.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=error install.sh test/e2e/linux.sh build/release.sh build/release-windows.sh test/release/*.sh
          else
            echo "shellcheck is unavailable; skipping (bash -n already passed)"
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          sed "s|/usr/local/lib/devstack/devstack-helper|$PWD/dist/devstack-helper|" \
            build/systemd/devstack-helper.service >"$tmp/devstack-helper.service"
          sed "s|%h/.local/bin/devstack|$PWD/dist/devstack|" \
            build/systemd/devstack-daemon.service >"$tmp/devstack-daemon.service"
          systemd-analyze verify "$tmp/devstack-helper.service" "$tmp/devstack-daemon.service"

          ./install.sh --dry-run

      # The script uses temporary HOME/state/hosts/trust paths and high ports.
      # When nginx is installed and port 7070 is free it also exercises a real
      # builtin -> nginx -> builtin switch; otherwise those steps skip with a
      # message. It never binds 80/443 or modifies the real trust stores, so no
      # sudo is needed for the E2E flow.
      - name: Linux installer and daemon E2E
        run: E2E_SKIP_BUILD=1 bash test/e2e/linux.sh

  # Manual Windows cross-build job on Linux.
  windows-cross:
    name: Windows cross-build
    if: ${{ inputs.windows || inputs.windows_native }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Windows cross-build
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          make build-windows
          make build-agent

      - name: Windows test compilation
        run: make test-windows-cross

      - name: Windows release packaging test
        run: make release-windows-test

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: devstack-windows-amd64
          path: |
            dist/devstack.exe
            dist/devstack-helper.exe
            dist/devstack-agent

  # Manual Windows test matrix on native Windows runners.
  windows-matrix:
    name: Windows native matrix (${{ matrix.os }})
    if: ${{ inputs.windows_native }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022]
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and compile
        shell: pwsh
        run: |
          go vet ./...
          go build ./...

      - name: Run Windows unit tests
        shell: pwsh
        run: go test ./...

      - name: Build Windows release binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CGO_ENABLED = "0"; $env:GOARCH = "amd64"
          $env:GOOS = "windows"
          go build -trimpath -o dist/devstack.exe ./cmd/devstack
          go build -trimpath -o dist/devstack-helper.exe ./cmd/devstack-helper
          $env:GOOS = "linux"
          go build -trimpath -o dist/devstack-agent ./cmd/devstack-agent
          Remove-Item Env:GOOS, Env:GOARCH, Env:CGO_ENABLED -ErrorAction SilentlyContinue

      - name: Run Windows installer tests
        shell: pwsh
        run: pwsh -File test/windows/installer_test.ps1

      - name: Run Windows lifecycle tests
        shell: pwsh
        run: pwsh -File test/windows/lifecycle_test.ps1

      - name: Build Windows release archive
        shell: pwsh
        run: pwsh -File build/release-windows.ps1 -Version 0.1.0 -SkipUI

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devstack-windows-release-${{ matrix.os }}
          path: |
            dist/release/devstack_*_windows_amd64.zip
            dist/release/checksums.txt
